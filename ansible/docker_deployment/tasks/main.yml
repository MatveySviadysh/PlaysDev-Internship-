- name: Start and enable Docker
  become: yes
  service:
    name: docker
    state: started
    enabled: yes


- name: Create Docker network
  become: yes
  docker_network:
    name: nginx_apache_net
    state: present


- name: Pull Nginx image
  become: yes
  docker_image:
    name: matveysviadysh/no-alpline-nginx
    tag: latest
    source: pull


- name: Pull Apache image
  become: yes
  docker_image:
    name: matveysviadysh/apache-unroot
    tag: latest
    source: pull


- name: Run Nginx container
  become: yes
  docker_container:
    name: my-nginx-container
    image: matveysviadysh/no-alpline-nginx:latest
    state: started
    restart_policy: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - name: nginx_apache_net


- name: Run Apache container
  become: yes
  docker_container:
    name: apache
    image: matveysviadysh/apache-unroot:latest
    state: started
    restart_policy: always
    ports:
      - "8080:80"
    networks:
      - name: nginx_apache_net