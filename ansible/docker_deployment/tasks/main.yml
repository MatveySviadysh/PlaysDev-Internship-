---
- name: Install Docker on Amazon Linux
  become: yes
  when: ansible_facts['os_family'] == "RedHat" and ansible_facts['distribution'] == "Amazon"
  yum:
    name: docker
    state: present

- name: Install Docker on Ubuntu
  become: yes
  when: ansible_facts['os_family'] == "Debian"
  apt:
    name: docker.io
    state: present
    update_cache: yes

- name: Add user to docker group
  become: yes
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes


- name: Install Docker Compose plugin
  become: yes
  shell: |
    mkdir -p ~/.docker/cli-plugins/
    curl -SL https://github.com/docker/compose/releases/download/v2.27.1/docker-compose-`uname -s`-`uname -m` -o ~/.docker/cli-plugins/docker-compose
    chmod +x ~/.docker/cli-plugins/docker-compose
  args:
    creates: ~/.docker/cli-plugins/docker-compose


- name: Download docker-compose
  become: yes
  get_url:
    url: https://github.com/docker/compose/releases/download/1.29.2/docker-compose-{{ ansible_system | lower }}-{{ ansible_architecture }}
    dest: /usr/local/bin/docker-compose
    mode: '0755'


