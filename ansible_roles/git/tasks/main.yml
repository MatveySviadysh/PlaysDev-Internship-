---
- name: Ensure git is installed
  package:
    name: git
    state: present
  become: yes

- name: Clone private repository using token
  git:
    repo: "https://{{ token }}@github.com/MatveySviadysh/PlaysDev-Internship-.git"
    dest: /opt/docker_apache
    version: main
    force: yes
  become: yes
  become_user: root
